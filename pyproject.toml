[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqcflower"
version = "0.1.0"
description = "Quantum-safe federated learning for smart agriculture"
license = "Apache-2.0"
dependencies = ["flwr==1.39.0", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["pqcflower"]

[tool.flwr.app]
publisher = "pqc-flower-team"

[tool.flwr.app.components]
serverapp = "pqcflower.server_app:app"
clientapp = "pqcflower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 15
num-farms = 3
local-epochs = 20
learning-rate = 1.0
dirichlet-alpha = 0.5
