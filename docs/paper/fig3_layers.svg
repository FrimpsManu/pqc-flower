<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="618" viewBox="0 0 1300 618" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-8a8a85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a85"/></marker><marker id="as-8a8a85" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8a85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="45" font-size="13" font-weight="bold" text-anchor="start" fill="#6b6b66" font-style="normal">Layer</text><text x="420" y="45" font-size="13" font-weight="bold" text-anchor="start" fill="#6b6b66" font-style="normal">Flower 1.39 as shipped</text><text x="850" y="45" font-size="13" font-weight="bold" text-anchor="start" fill="#6b6b66" font-style="normal">Our system</text><text x="40" y="100" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Secure aggregation (SecAgg+)</text><text x="40" y="120" font-size="12" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="italic">hides single updates from the server</text><rect x="410" y="78" width="410" height="62" rx="6" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="424" y="103" font-size="14" font-weight="bold" text-anchor="start" fill="#a86400" font-style="normal">ECDH P-384</text><text x="424" y="122" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">optional; not enabled in our runs</text><rect x="840" y="78" width="410" height="62" rx="6" fill="#ffffff" stroke="#b5b5b0" stroke-width="1.4" stroke-dasharray="6 4"/><text x="854" y="103" font-size="14" font-weight="bold" text-anchor="start" fill="#6b6b66" font-style="normal">not enabled yet</text><text x="854" y="122" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ML-KEM-768 version planned (stretch goal)</text><text x="40" y="178" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Model-update integrity</text><text x="40" y="198" font-size="12" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="italic">was this update changed or forged?</text><rect x="410" y="156" width="410" height="62" rx="6" fill="#ffffff" stroke="#b5b5b0" stroke-width="1.4" stroke-dasharray="6 4"/><text x="424" y="181" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318" font-style="normal">none</text><text x="424" y="200" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">the server averages whatever arrives</text><rect x="840" y="156" width="410" height="62" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="854" y="181" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">ML-DSA-65 signature per update</text><text x="854" y="200" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">over round, farm ID and weights</text><text x="40" y="256" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Farm login (gRPC metadata)</text><text x="40" y="276" font-size="12" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="italic">is this request really from farm k?</text><rect x="410" y="234" width="410" height="62" rx="6" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="424" y="259" font-size="14" font-weight="bold" text-anchor="start" fill="#a86400" font-style="normal">ECDSA P-384 on every request</text><text x="424" y="278" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">public key + signature each time</text><rect x="840" y="234" width="410" height="62" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="854" y="259" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">ML-DSA-65 once per session</text><text x="854" y="278" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">then HMAC-SHA256 session tags</text><text x="40" y="334" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">TLS 1.3 server certificate</text><text x="40" y="354" font-size="12" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="italic">is this the real server?</text><rect x="410" y="312" width="410" height="62" rx="6" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="424" y="347" font-size="14" font-weight="bold" text-anchor="start" fill="#a86400" font-style="normal">ECDSA P-384</text><rect x="840" y="312" width="410" height="62" rx="6" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="854" y="337" font-size="14" font-weight="bold" text-anchor="start" fill="#a86400" font-style="normal">ECDSA P-384 (unchanged)</text><text x="854" y="356" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ML-DSA certificates not yet in gRPC</text><text x="40" y="412" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">TLS 1.3 key exchange</text><text x="40" y="432" font-size="12" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="italic">keeps all traffic secret</text><rect x="410" y="390" width="410" height="62" rx="6" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="424" y="415" font-size="14" font-weight="bold" text-anchor="start" fill="#1f5f99" font-style="normal">X25519MLKEM768 (hybrid)</text><text x="424" y="434" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">default in grpcio 1.84</text><rect x="840" y="390" width="410" height="62" rx="6" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="854" y="415" font-size="14" font-weight="bold" text-anchor="start" fill="#1f5f99" font-style="normal">X25519MLKEM768 (hybrid)</text><text x="854" y="434" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">kept, verified and measured</text><text x="40" y="490" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Transport</text><rect x="410" y="468" width="410" height="62" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="424" y="503" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">TCP / HTTP/2 / gRPC</text><rect x="840" y="468" width="410" height="62" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="854" y="503" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">TCP / HTTP/2 / gRPC</text><line x1="1272" y1="528" x2="1272" y2="80" stroke="#8a8a85" stroke-width="1.4" marker-end="url(#a-8a8a85)"/><text x="1288" y="304.0" font-size="12" fill="#6b6b66" text-anchor="middle" transform="rotate(-90 1288 304.0)">closer to the application</text><rect x="40" y="571" width="26" height="16" rx="3" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="74" y="584" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">post-quantum, added by us</text><rect x="249.0" y="571" width="26" height="16" rx="3" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="283.0" y="584" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">post-quantum, already in gRPC</text><rect x="484.4" y="571" width="26" height="16" rx="3" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="518.4" y="584" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">classical (breakable by Shor's algorithm)</text><rect x="799.0" y="571" width="26" height="16" rx="3" fill="#ffffff" stroke="#b5b5b0" stroke-width="1.4" stroke-dasharray="5 3"/><text x="833.0" y="584" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">no protection</text></svg>