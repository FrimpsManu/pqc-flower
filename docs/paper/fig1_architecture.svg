<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a-b42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="as-b42318" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b42318"/></marker><marker id="a-1f5f99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/></marker><marker id="as-1f5f99" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f5f99"/></marker><marker id="a-55554f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55554f"/></marker><marker id="as-55554f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#55554f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="30" width="290" height="112" rx="6" fill="#fbfbf9" stroke="#8a8a85" stroke-width="1.4"/><text x="42" y="52" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Operator laptop: flwr CLI</text><text x="42" y="71" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">registers each farm's login public key</text><text x="42" y="88" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">submits the app bundle (FAB) and starts a run</text><text x="42" y="105" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">streams the server log</text><rect x="30" y="180" width="610" height="650" rx="6" fill="#ffffff" stroke="#5f5f5a" stroke-width="2"/><text x="624" y="204" font-size="13" font-weight="bold" text-anchor="end" fill="#5f5f5a" font-style="normal">SERVER (aggregator)</text><rect x="48" y="216" width="574" height="352" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="608" y="238" font-size="14" font-weight="bold" text-anchor="end" fill="#1d1d1b" font-style="normal">SuperLink  (pqc-flower-superlink)</text><rect x="66" y="258" width="250" height="78" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="78" y="280" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Control + runtime API  :8000</text><text x="78" y="299" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">HTTP, bound to localhost</text><text x="78" y="316" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">used by the CLI and the ServerApp</text><rect x="66" y="352" width="250" height="112" rx="6" fill="#fbfbf9" stroke="#8a8a85" stroke-width="1.4"/><text x="78" y="374" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">LinkState  (SQLite)</text><text x="78" y="393" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">registered farm login keys</text><text x="78" y="410" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">runs and the app bundle</text><text x="78" y="427" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">task messages waiting in / out</text><rect x="66" y="480" width="250" height="74" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="78" y="502" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Session table (in memory)</text><text x="78" y="521" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">session ID -&gt; key, farm, expiry</text><text x="78" y="538" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">10-minute lifetime</text><rect x="334" y="258" width="270" height="78" rx="6" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="346" y="280" font-size="14" font-weight="bold" text-anchor="start" fill="#1f5f99" font-style="normal">Fleet API  :9092</text><text x="346" y="299" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">gRPC over TLS 1.3</text><text x="346" y="316" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">the only port the farms can reach</text><rect x="334" y="352" width="270" height="112" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="346" y="374" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">Farm login check</text><text x="346" y="393" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">first request: verify ML-DSA-65</text><text x="346" y="410" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">signature, then issue a session</text><text x="346" y="427" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">later requests: check the</text><text x="346" y="444" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">HMAC-SHA256 session tag</text><rect x="334" y="480" width="270" height="74" rx="6" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="346" y="502" font-size="14" font-weight="bold" text-anchor="start" fill="#a86400" font-style="normal">TLS server certificate</text><text x="346" y="521" font-size="12.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ECDSA P-384 (still classical)</text><line x1="330" y1="568" x2="330" y2="600" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)" marker-start="url(#as-55554f)"/><text x="342" y="590" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5f5f5a" font-style="normal">runtime API (SuperExec starts the ServerApp)</text><rect x="48" y="604" width="574" height="210" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="60" y="626" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">ServerApp process  (flwr-serverapp): SignedFedAvg</text><rect x="66" y="646" width="172" height="96" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="78" y="668" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">1. Verify update</text><text x="78" y="687" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ML-DSA-65 signature over</text><text x="78" y="704" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">round, farm ID, weights</text><rect x="252" y="646" width="172" height="96" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="264" y="668" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">2. FedAvg</text><text x="264" y="687" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">weighted average of</text><text x="264" y="704" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">the accepted updates</text><rect x="438" y="646" width="166" height="96" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="450" y="668" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">3. Evaluate</text><text x="450" y="687" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">accuracy on the 440</text><text x="450" y="704" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">held-out test samples</text><line x1="238" y1="694" x2="252" y2="694" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)"/><line x1="424" y1="694" x2="438" y2="694" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)"/><text x="66" y="768" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">Holds every farm's update-verification public key (ML-DSA-65, 1,952 B).</text><text x="66" y="786" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">A rejected update is logged and left out of the average; the round goes on.</text><path d="M175,142 L175,258" fill="none" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)"/><text x="184" y="176" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5f5f5a" font-style="normal">Control API</text><rect x="900" y="180" width="570" height="500" rx="6" fill="#ffffff" stroke="#5f5f5a" stroke-width="2"/><text x="916" y="204" font-size="13" font-weight="bold" text-anchor="start" fill="#5f5f5a" font-style="normal">FARM 0 (each of the three farms is the same)</text><rect x="918" y="216" width="534" height="176" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="930" y="238" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">SuperNode  (pqc-flower-supernode)</text><rect x="936" y="258" width="262" height="118" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="948" y="280" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">Farm login</text><text x="948" y="299" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">first request: ML-DSA-65 signature</text><text x="948" y="316" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">(public key + signature, ~8 KB)</text><text x="948" y="333" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">later: session ID + timestamp</text><text x="948" y="350" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">+ HMAC tag (~150 B)</text><rect x="1212" y="258" width="224" height="118" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="1224" y="280" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">ClientAppIo API  :9100</text><text x="1224" y="299" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">localhost only</text><text x="1224" y="316" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">hands each task to a</text><text x="1224" y="333" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ClientApp process and</text><text x="1224" y="350" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">collects its reply</text><line x1="1324" y1="392" x2="1324" y2="420" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)" marker-start="url(#as-55554f)"/><rect x="918" y="424" width="534" height="148" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="930" y="446" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">ClientApp process  (flwr-clientapp, one per task)</text><rect x="936" y="464" width="262" height="92" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="948" y="486" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Local training</text><text x="948" y="505" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">softmax regression, 176 weights</text><text x="948" y="522" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">20 epochs on this farm's data</text><text x="948" y="539" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">sends back weights, not data</text><rect x="1212" y="464" width="224" height="92" rx="6" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="1224" y="486" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32" font-style="normal">Sign the update</text><text x="1224" y="505" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">ML-DSA-65 over round,</text><text x="1224" y="522" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">farm ID and weights</text><text x="1224" y="539" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">(3,309 B signature)</text><line x1="1198" y1="510" x2="1212" y2="510" stroke="#55554f" stroke-width="1.6" marker-end="url(#a-55554f)"/><rect x="918" y="588" width="262" height="76" rx="6" fill="#fbfbf9" stroke="#8a8a85" stroke-width="1.4"/><text x="930" y="610" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Private crop data</text><text x="930" y="629" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">Dirichlet (alpha = 0.5) share</text><text x="930" y="646" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">never leaves the farm</text><rect x="1194" y="588" width="258" height="76" rx="6" fill="#fbfbf9" stroke="#8a8a85" stroke-width="1.4"/><text x="1206" y="610" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Farm keys (ML-DSA-65)</text><text x="1206" y="629" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">login key + update-signing key</text><text x="1206" y="646" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">private halves stay on the farm</text><rect x="918" y="700" width="552" height="50" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="930" y="722" font-size="13.5" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Farm 1   same components, its own data and keys</text><rect x="918" y="766" width="552" height="50" rx="6" fill="#f4f4f2" stroke="#8a8a85" stroke-width="1.4"/><text x="930" y="788" font-size="13.5" font-weight="bold" text-anchor="start" fill="#1d1d1b" font-style="normal">Farm 2   same components, its own data and keys</text><rect x="604" y="285" width="314" height="26" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="761" y="303" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f5f99" font-style="normal">gRPC / HTTP/2 over TLS 1.3</text><text x="761" y="250" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f5f99" font-style="normal">key exchange X25519MLKEM768</text><text x="761" y="267" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f5f99" font-style="normal">(hybrid post-quantum, from gRPC)</text><path d="M872,311 L872,725 L918,725" fill="none" stroke="#1f5f99" stroke-width="1.4" marker-end="url(#a-1f5f99)"/><path d="M886,311 L886,791 L918,791" fill="none" stroke="#1f5f99" stroke-width="1.4" marker-end="url(#a-1f5f99)"/><text x="652" y="676" font-size="11.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">one TLS connection per farm</text><text x="652" y="691" font-size="11.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">RPCs: ActivateNode, PullMessages,</text><text x="652" y="706" font-size="11.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">PushMessages, SendNodeHeartbeat,</text><text x="652" y="721" font-size="11.5" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">PullObject, PushObject</text><rect x="652" y="410" width="200" height="92" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="432" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318" font-style="normal">Attack 1 (simulated)</text><text x="664" y="451" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">changes farm 0's update</text><text x="664" y="468" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">on the way to the server;</text><text x="664" y="485" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">cannot re-sign it</text><path d="M752,410 L752,316" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-b42318)"/><rect x="652" y="520" width="200" height="128" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.4" stroke-dasharray="6 4"/><text x="664" y="542" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318" font-style="normal">Attack 2 (simulated)</text><text x="664" y="561" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">a quantum attacker copies</text><text x="664" y="578" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">farm 0's public key, recovers</text><text x="664" y="595" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">the ECDSA key with Shor's</text><text x="664" y="612" font-size="12" font-weight="normal" text-anchor="start" fill="#33332f" font-style="normal">algorithm, logs in as farm 0</text><path d="M652,560 C630,560 630,410 604,410" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-b42318)"/><rect x="40" y="888" width="26" height="16" rx="3" fill="#e7f3ea" stroke="#2e7d32" stroke-width="1.4"/><text x="74" y="901" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">post-quantum, added by us</text><rect x="249.0" y="888" width="26" height="16" rx="3" fill="#e6eff8" stroke="#1f5f99" stroke-width="1.4"/><text x="283.0" y="901" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">post-quantum, already in gRPC</text><rect x="484.4" y="888" width="26" height="16" rx="3" fill="#fdf3e1" stroke="#a86400" stroke-width="1.4"/><text x="518.4" y="901" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">still classical</text><rect x="627.4" y="888" width="26" height="16" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.4" stroke-dasharray="5 3"/><text x="661.4" y="901" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">simulated attacker (demos only)</text><rect x="876.0" y="888" width="26" height="16" rx="3" fill="#fbfbf9" stroke="#8a8a85" stroke-width="1.4"/><text x="910.0" y="901" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d1d1b" font-style="normal">data / keys / tools</text><text x="40" y="935" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6b6b66" font-style="normal">Ports and processes as observed on a live run (Flower 1.39.0). Farms reach only port 9092; ports 8000 and 9100-9102 are bound to localhost.</text></svg>