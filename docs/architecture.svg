<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C53030"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="580" fill="#FFFFFF"/>
  <text x="700" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F2937">System architecture: quantum-safe Flower for smart agriculture</text>

  <!-- ===== Farms ===== -->
  <text x="185" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A5568">FARMS (Flower SuperNodes)</text>
  <g>
    <rect x="30" y="86" width="310" height="112" rx="10" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="2"/>
    <text x="48" y="114" font-size="18" font-weight="bold" fill="#1F2937">Farm 0</text>
    <text x="48" y="138" font-size="14" fill="#4A5568">Private soil and weather data (stays local)</text>
    <text x="48" y="158" font-size="14" fill="#4A5568">ClientApp: trains the crop model locally</text>
    <rect x="46" y="168" width="278" height="22" rx="11" fill="#C6F6D5"/>
    <text x="185" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#22543D">Signs each update with ML-DSA-65 (done)</text>
  </g>
  <g>
    <rect x="30" y="218" width="310" height="112" rx="10" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="2"/>
    <text x="48" y="246" font-size="18" font-weight="bold" fill="#1F2937">Farm 1</text>
    <text x="48" y="270" font-size="14" fill="#4A5568">Private soil and weather data (stays local)</text>
    <text x="48" y="290" font-size="14" fill="#4A5568">ClientApp: trains the crop model locally</text>
    <rect x="46" y="300" width="278" height="22" rx="11" fill="#C6F6D5"/>
    <text x="185" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#22543D">Signs each update with ML-DSA-65 (done)</text>
  </g>
  <g>
    <rect x="30" y="350" width="310" height="112" rx="10" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="2"/>
    <text x="48" y="378" font-size="18" font-weight="bold" fill="#1F2937">Farm 2</text>
    <text x="48" y="402" font-size="14" fill="#4A5568">Private soil and weather data (stays local)</text>
    <text x="48" y="422" font-size="14" fill="#4A5568">ClientApp: trains the crop model locally</text>
    <rect x="46" y="432" width="278" height="22" rx="11" fill="#C6F6D5"/>
    <text x="185" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#22543D">Signs each update with ML-DSA-65 (done)</text>
  </g>

  <!-- ===== Channel ===== -->
  <rect x="380" y="60" width="430" height="58" rx="8" fill="#EBF8FF" stroke="#90CDF4" stroke-width="1.5"/>
  <text x="595" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C5282">gRPC over TLS 1.3</text>
  <text x="595" y="106" text-anchor="middle" font-size="13" fill="#2C5282">Key exchange: hybrid X25519 + ML-KEM-768 (already in gRPC 1.84)</text>

  <!-- updates: farm -> server -->
  <line x1="340" y1="142" x2="470" y2="164" stroke="#4A5568" stroke-width="2.5"/>
  <line x1="720" y1="190" x2="868" y2="228" stroke="#C53030" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <text x="800" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">tampered</text>
  <line x1="340" y1="274" x2="868" y2="274" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="340" y1="406" x2="868" y2="318" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="604" y="264" text-anchor="middle" font-size="14" fill="#2D3748">signed model update (weights + round + farm id)</text>

  <!-- global model back to farms -->
  <path d="M 868 352 C 700 470, 520 500, 345 470" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="640" y="518" text-anchor="middle" font-size="14" fill="#4A5568">updated global model sent back to every farm, each round</text>

  <!-- attacker -->
  <rect x="470" y="140" width="250" height="62" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="595" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#C53030">Simulated attacker (Attack 1)</text>
  <text x="595" y="186" text-anchor="middle" font-size="13" fill="#C53030">alters Farm 0's update in transit</text>

  <!-- ===== Server ===== -->
  <rect x="872" y="70" width="498" height="410" rx="12" fill="#F7FAFC" stroke="#2D3748" stroke-width="2.5"/>
  <text x="1121" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Server: Flower SuperLink + ServerApp</text>

  <rect x="892" y="116" width="458" height="58" rx="8" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1.5"/>
  <text x="910" y="140" font-size="15" font-weight="bold" fill="#744210">1. Farm login (node authentication)</text>
  <text x="910" y="162" font-size="13" fill="#744210">ECDSA P-384 today → ML-DSA-65 (in progress)</text>

  <rect x="892" y="184" width="458" height="58" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5"/>
  <text x="910" y="208" font-size="15" font-weight="bold" fill="#22543D">2. Verify ML-DSA-65 signature on each update</text>
  <text x="910" y="230" font-size="13" fill="#22543D">Invalid or tampered update → rejected (done)</text>

  <rect x="892" y="252" width="458" height="58" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="910" y="276" font-size="15" font-weight="bold" fill="#2D3748">3. Aggregate accepted updates (FedAvg)</text>
  <text x="910" y="298" font-size="13" fill="#4A5568">New global crop model; accuracy checked on held-out data</text>

  <rect x="892" y="320" width="458" height="58" rx="8" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1.5"/>
  <text x="910" y="344" font-size="15" font-weight="bold" fill="#744210">Secure aggregation (SecAgg+)</text>
  <text x="910" y="366" font-size="13" fill="#744210">ECDH P-384 today → ML-KEM-768 (stretch goal)</text>

  <rect x="892" y="388" width="458" height="58" rx="8" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1.5"/>
  <text x="910" y="412" font-size="15" font-weight="bold" fill="#744210">TLS server certificate</text>
  <text x="910" y="434" font-size="13" fill="#744210">ECDSA P-384 today → ML-DSA (if gRPC supports it)</text>

  <!-- ===== Legend ===== -->
  <g font-size="14" fill="#2D3748">
    <rect x="200" y="545" width="22" height="16" rx="4" fill="#C6F6D5" stroke="#38A169"/>
    <text x="230" y="558">Post-quantum, done</text>
    <rect x="410" y="545" width="22" height="16" rx="4" fill="#EBF8FF" stroke="#90CDF4"/>
    <text x="440" y="558">Post-quantum, built into gRPC</text>
    <rect x="680" y="545" width="22" height="16" rx="4" fill="#FEFCBF" stroke="#D69E2E"/>
    <text x="710" y="558">Classical today, PQC planned</text>
    <rect x="940" y="545" width="22" height="16" rx="4" fill="#FFF5F5" stroke="#C53030" stroke-dasharray="4 3"/>
    <text x="970" y="558">Simulated attack (demo only)</text>
  </g>
</svg>
